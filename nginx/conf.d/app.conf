upstream safe_app {
    server app:8080;
}

upstream safe_auth {
    server auth:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 2m;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req  zone=perip burst=20 nodelay;
    limit_conn connperip 20;

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$) {
        return 405;
    }

    location = /healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://safe_app/healthz;
    }

    location = /_auth {
        internal;
        proxy_pass http://safe_auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Token $http_x_auth_token;
        proxy_set_header Cookie $http_cookie;
    }

    location = /auth/login {
        limit_req zone=perip burst=10 nodelay;
        proxy_pass http://safe_auth/login;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Token $http_x_auth_token;
        proxy_set_header Cookie $http_cookie;
        proxy_intercept_errors on;
        error_page 403 = @forbidden;
    }

    location / {
        auth_request /_auth;
        error_page 401 = @token_required;
        error_page 403 = @forbidden;

        proxy_pass http://safe_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @token_required {
        default_type application/json;
        return 401 '{"error":"unauthorized","hint":"open /auth/login?token=YOUR_TOKEN or send the X-Auth-Token header"}';
    }

    location @forbidden {
        # auth service signals rate-limit overflow with 403; drop it silently
        return 444;
    }
}
